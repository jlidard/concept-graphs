hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - dataset_root=/home/pbrick/dev/data
    - dataset_config=/home/pbrick/concept-graphs/conceptgraph/dataset/dataconfigs/zed2i/zed2i.yaml
    - stride=5
    - scene_id=250820_ECL_500_2_0.01_20_1_test
    - spatial_sim_type=overlap
    - mask_conf_threshold=0.2
    - match_method=sim_sum
    - sim_threshold=1.0
    - dbscan_eps=0.05
    - dbscan_min_points=5
    - gsa_variant=ram_withbg_allclasses
    - skip_bg=False
    - max_bbox_area_ratio=10.0
    - save_suffix=OUTSIDE
    - obj_min_detections=1
    - dbscan_remove_noise=False
    - downsample_voxel_size=0.01
    - mask_area_threshold=5
    - min_points_threshold=16
    - vis_render=False
    - debug_render=False
    - save_objects_all_frames=True
  job:
    name: cfslam_pipeline_batch
    chdir: null
    override_dirname: dataset_config=/home/pbrick/concept-graphs/conceptgraph/dataset/dataconfigs/zed2i/zed2i.yaml,dataset_root=/home/pbrick/dev/data,dbscan_eps=0.05,dbscan_min_points=5,dbscan_remove_noise=False,debug_render=False,downsample_voxel_size=0.01,gsa_variant=ram_withbg_allclasses,mask_area_threshold=5,mask_conf_threshold=0.2,match_method=sim_sum,max_bbox_area_ratio=10.0,min_points_threshold=16,obj_min_detections=1,save_objects_all_frames=True,save_suffix=OUTSIDE,scene_id=250820_ECL_500_2_0.01_20_1_test,sim_threshold=1.0,skip_bg=False,spatial_sim_type=overlap,stride=5,vis_render=False
    id: ???
    num: ???
    config_name: base
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /home/pbrick/concept-graphs
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/pbrick/concept-graphs/conceptgraph/configs/slam_pipeline
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/pbrick/concept-graphs/outputs/2025-08-28/12-13-11
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
